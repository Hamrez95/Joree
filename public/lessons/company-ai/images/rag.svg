<svg xmlns="http://www.w3.org/2000/svg" width="720" height="630" viewBox="0 0 720 630" role="img" aria-labelledby="title desc"><title id="title">دو مسیر سامانهٔ بازیابی</title><desc id="desc">آماده‌سازی: سند معتبر، استخراج متن ← قطعه‌بندی ← ثبت نسخه و مجوز؛ ذخیرهٔ قطعه و نمایه، بردار، متن، شناسه و مشخصات منبع؛ پاسخ‌گویی: سؤال و هویت معتبر، فیلتر دسترسی ← جست‌وجو ← انتخاب شاهد؛ مدل و پاسخ مستند، سؤال + شاهد مجاز ← پاسخ با ارجاع یا ندانستن</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#333"/></marker></defs><rect width="720" height="630" fill="#fafafa"/><g font-family="Vazirmatn, Tahoma, sans-serif" text-anchor="middle" direction="rtl" fill="#222"><text x="360" y="47" font-size="29" font-weight="700">دو مسیر سامانهٔ بازیابی</text><rect x="24" y="88" width="672" height="100" rx="12" fill="#fff" stroke="#555" stroke-width="2"/><text x="360" y="123" font-size="25" font-weight="700">آماده‌سازی: سند معتبر</text><text x="360" y="161" font-size="20">استخراج متن ← قطعه‌بندی ← ثبت نسخه و مجوز</text><rect x="24" y="216" width="672" height="100" rx="12" fill="#fff" stroke="#555" stroke-width="2"/><text x="360" y="251" font-size="25" font-weight="700">ذخیرهٔ قطعه و نمایه</text><text x="360" y="289" font-size="20">بردار، متن، شناسه و مشخصات منبع</text><path d="M360 192 V210" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="344" width="672" height="100" rx="12" fill="#fff" stroke="#555" stroke-width="2"/><text x="360" y="379" font-size="25" font-weight="700">پاسخ‌گویی: سؤال و هویت معتبر</text><text x="360" y="417" font-size="20">فیلتر دسترسی ← جست‌وجو ← انتخاب شاهد</text><path d="M360 320 V338" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="472" width="672" height="100" rx="12" fill="#fff" stroke="#555" stroke-width="2"/><text x="360" y="507" font-size="25" font-weight="700">مدل و پاسخ مستند</text><text x="360" y="545" font-size="20">سؤال + شاهد مجاز ← پاسخ با ارجاع یا ندانستن</text><path d="M360 448 V466" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="610" font-size="18">حذف یا تغییر سند باید در نمایه هم اعمال بشه.</text></g></svg>