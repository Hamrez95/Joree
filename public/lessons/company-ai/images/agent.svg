<svg xmlns="http://www.w3.org/2000/svg" width="720" height="630" viewBox="0 0 720 630" role="img" aria-labelledby="title desc"><title id="title">حلقهٔ محدود ایجنت</title><desc id="desc">هدف و وضعیت فعلی، مدل قدم بعدی را در محدودهٔ ابزارها پیشنهاد میده.؛ کنترل برنامه، اعتبار ورودی، هویت، مجوز و تأیید لازم بررسی میشه.؛ اجرای ابزار و مشاهده، نتیجه یا خطای واقعی به وضعیت برمی‌گرده.؛ تصمیم بعدی یا توقف، تکرار با سقف قدم؛ ابهام یا عمل حساس ← انسان</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#333"/></marker></defs><rect width="720" height="630" fill="#fafafa"/><g font-family="Vazirmatn, Tahoma, sans-serif" text-anchor="middle" direction="rtl" fill="#222"><text x="360" y="47" font-size="29" font-weight="700">حلقهٔ محدود ایجنت</text><rect x="24" y="88" width="672" height="100" rx="12" fill="#fff" stroke="#555" stroke-width="2"/><text x="360" y="123" font-size="25" font-weight="700">هدف و وضعیت فعلی</text><text x="360" y="161" font-size="20">مدل قدم بعدی را در محدودهٔ ابزارها پیشنهاد میده.</text><rect x="24" y="216" width="672" height="100" rx="12" fill="#fff" stroke="#555" stroke-width="2"/><text x="360" y="251" font-size="25" font-weight="700">کنترل برنامه</text><text x="360" y="289" font-size="20">اعتبار ورودی، هویت، مجوز و تأیید لازم بررسی میشه.</text><path d="M360 192 V210" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="344" width="672" height="100" rx="12" fill="#fff" stroke="#555" stroke-width="2"/><text x="360" y="379" font-size="25" font-weight="700">اجرای ابزار و مشاهده</text><text x="360" y="417" font-size="20">نتیجه یا خطای واقعی به وضعیت برمی‌گرده.</text><path d="M360 320 V338" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="472" width="672" height="100" rx="12" fill="#fff" stroke="#555" stroke-width="2"/><text x="360" y="507" font-size="25" font-weight="700">تصمیم بعدی یا توقف</text><text x="360" y="545" font-size="20">تکرار با سقف قدم؛ ابهام یا عمل حساس ← انسان</text><path d="M360 448 V466" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="610" font-size="18">پیشنهاد مدل مجوز اجرای ابزار نیست.</text></g></svg>