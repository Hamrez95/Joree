<svg xmlns="http://www.w3.org/2000/svg" width="720" height="630" viewBox="0 0 720 630" role="img" aria-labelledby="title desc"><title id="title">اجزای دستیار در شبکهٔ شرکت</title><desc id="desc">کاربر ← درگاه ورود، احراز هویت، سقف درخواست و ثبت شناسه؛ برنامه ← بازیابی مجاز، کنترل نقش، سند معتبر و مخزن جست‌وجو؛ برنامه ← سرویس مدل، سؤال و قطعه‌های مجاز، با سقف زمان و زمینه؛ برنامه ← پاسخ و پایش، نمایش شاهد، ثبت سلامت و امکان رسیدگی انسانی</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#333"/></marker></defs><rect width="720" height="630" fill="#fafafa"/><g font-family="Vazirmatn, Tahoma, sans-serif" text-anchor="middle" direction="rtl" fill="#222"><text x="360" y="47" font-size="29" font-weight="700">اجزای دستیار در شبکهٔ شرکت</text><rect x="24" y="88" width="672" height="100" rx="12" fill="#fff" stroke="#555" stroke-width="2"/><text x="360" y="123" font-size="25" font-weight="700">کاربر ← درگاه ورود</text><text x="360" y="161" font-size="20">احراز هویت، سقف درخواست و ثبت شناسه</text><rect x="24" y="216" width="672" height="100" rx="12" fill="#fff" stroke="#555" stroke-width="2"/><text x="360" y="251" font-size="25" font-weight="700">برنامه ← بازیابی مجاز</text><text x="360" y="289" font-size="20">کنترل نقش، سند معتبر و مخزن جست‌وجو</text><path d="M360 192 V210" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="344" width="672" height="100" rx="12" fill="#fff" stroke="#555" stroke-width="2"/><text x="360" y="379" font-size="25" font-weight="700">برنامه ← سرویس مدل</text><text x="360" y="417" font-size="20">سؤال و قطعه‌های مجاز، با سقف زمان و زمینه</text><path d="M360 320 V338" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="472" width="672" height="100" rx="12" fill="#fff" stroke="#555" stroke-width="2"/><text x="360" y="507" font-size="25" font-weight="700">برنامه ← پاسخ و پایش</text><text x="360" y="545" font-size="20">نمایش شاهد، ثبت سلامت و امکان رسیدگی انسانی</text><path d="M360 448 V466" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="610" font-size="18">هر اتصال بیرون این مرز نیاز به بررسی جریان داده داره.</text></g></svg>