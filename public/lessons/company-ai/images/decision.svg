<svg xmlns="http://www.w3.org/2000/svg" width="720" height="502" viewBox="0 0 720 502" role="img" aria-labelledby="title desc"><title id="title">از مسئله تا راهکار</title><desc id="desc">رفتار یا قالب مبهمه؟، اول دستور و نمونه‌ها را اصلاح کنید.؛ اطلاعات تازه یا اختصاصی لازمه؟، سند معتبر را بازیابی و به زمینه اضافه کنید.؛ الگوی تخصصی هنوز درست اجرا نمیشه؟، با داده و معیار، آموزش تکمیلی را آزمایش کنید.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#333"/></marker></defs><rect width="720" height="502" fill="#fafafa"/><g font-family="Vazirmatn, Tahoma, sans-serif" text-anchor="middle" direction="rtl" fill="#222"><text x="360" y="47" font-size="29" font-weight="700">از مسئله تا راهکار</text><rect x="24" y="88" width="672" height="100" rx="12" fill="#fff" stroke="#555" stroke-width="2"/><text x="360" y="123" font-size="25" font-weight="700">رفتار یا قالب مبهمه؟</text><text x="360" y="161" font-size="20">اول دستور و نمونه‌ها را اصلاح کنید.</text><rect x="24" y="216" width="672" height="100" rx="12" fill="#fff" stroke="#555" stroke-width="2"/><text x="360" y="251" font-size="25" font-weight="700">اطلاعات تازه یا اختصاصی لازمه؟</text><text x="360" y="289" font-size="20">سند معتبر را بازیابی و به زمینه اضافه کنید.</text><path d="M360 192 V210" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="344" width="672" height="100" rx="12" fill="#fff" stroke="#555" stroke-width="2"/><text x="360" y="379" font-size="25" font-weight="700">الگوی تخصصی هنوز درست اجرا نمیشه؟</text><text x="360" y="417" font-size="20">با داده و معیار، آموزش تکمیلی را آزمایش کنید.</text><path d="M360 320 V338" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="482" font-size="18">این مسیر راهنمای شروعه؛ روش‌ها می‌تونن ترکیب بشن.</text></g></svg>