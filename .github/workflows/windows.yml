name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Test lesson, review, and game logic
        run: npm test
      - name: Test the interface in Microsoft Edge
        run: npx playwright test
      - name: Build frontend
        run: npm run build
      - name: Build the per-user Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipFrontend
      - name: Run native persistence and placement smoke checks
        shell: pwsh
        run: |
          $version=([xml](Get-Content windows/Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $process=Start-Process -FilePath "$pwd/release/app-$version/Joree.exe" -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if($process.ExitCode -ne 0){throw 'Native self-test failed'}
      - name: Keep the Windows downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: joree-windows-preview
          if-no-files-found: error
          path: |
            release/JoreeSetup.exe
            release/Joree-*-win-x64.zip
            release/Joree-lesson-template.md
            release/INSTALL.md
            release/SHA256SUMS.txt
